          - type: 'null'
          title: Read
      - name: done
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Done
      - name: createdSince
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdsince
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - createdAt.desc
          - createdAt.asc
          type: string
          default: createdAt.desc
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
