  /api/v1/events/inbox:
    post:
      tags:
      - Event Inbox
      summary: Receive an event of a split-out module (CloudEvent)
      operationId: receive_event_api_v1_events_inbox_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: 'Accepted: the event is on the event bus (or was already received
            with this `source` and `id`)'
        '400':
          description: 'validation: an attribute is missing or wrong (FRAMEWORK 6)'
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          description: 'unauthorized: token missing or invalid'
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: 'forbidden: not the service account of the module named in
            `source`'
          content:
            application/problem+json:
              schema:
                type: object
        '413':
          description: 'payload-too-large: body larger than EVENT_INBOX_MAX_BYTES'
          content:
            application/problem+json:
              schema:
                type: object
        '415':
          description: 'unsupported-media-type: neither structured nor binary content
            mode'
          content:
            application/problem+json:
              schema:
                type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              type: object
              required:
              - specversion
              - id
              - source
              - type
              - time
              - datacontenttype
              - data
              additionalProperties: false
              properties:
                specversion:
                  const: '1.0'
                id:
                  type: string
                  format: uuid
                source:
                  type: string
                  pattern: ^urn:c[0-9]+-m[0-9]+$
                  examples:
                  - urn:c1-m2
                type:
                  type: string
                  pattern: ^[A-Z][A-Za-z0-9]*$
                  examples:
                  - ApplicationSubmitted
                time:
                  type: string
                  format: date-time
                datacontenttype:
                  const: application/json
                data:
                  type: object
                  description: content of the event (FRAMEWORK 6, README section 10)
            example:
              specversion: '1.0'
              id: b8e1f7a0-1c2d-4e3f-9a8b-7c6d5e4f3a2b
              source: urn:c1-m2
              type: ApplicationSubmitted
              time: '2026-11-06T09:30:00Z'
              datacontenttype: application/json
              data:
                applicationId: 0f8e2d4c-6b1a-4c3e-8f7d-2a9b1c0d3e4f
                companyId: c0000001-0000-4000-8000-000000000001
                kind: ONBOARDING
                existingCompany: false
                applicantSub: 5a1c0001-0000-4000-8000-000000000001
          application/json:
            schema:
              type: object
              description: '`data` of the event (binary content mode; the attributes
                are in the `ce-` headers)'
