{{- /*
The clients of the EBW-Connector (CLIENTS_FILE, C5-M1 6.8): the demo portal and the Business Wallet of this stack
with their public addresses, then the entries of `connector.clients`. The EBW-Connector reads the file at every
request, so a change arrives without a restart, about a minute after `helm upgrade`.
*/ -}}
{{- $tools := include "ebw-stack.testToolsUrl" . }}
{{- $wallet := include "ebw-stack.businessWalletUrl" . }}
{{- $demo := dict "clientId" "demo-osp" "name" "OSP 2.0 demo portal" "jwksUri" (printf "%s/osp/jwks" $tools) "redirectUris" (list (printf "%s/osp/callback" $tools)) "scopes" (list "openid" "profile" "representation" "company" "attestation") }}
{{- $business := dict "clientId" "business-wallet" "name" "Business Wallet" "jwksUri" (printf "%s/jwks" $wallet) "redirectUris" (list (printf "%s/login/callback" $wallet)) "scopes" (list "openid" "profile" "representation") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebw-stack.fullname" . }}-clients
  labels:
    {{- include "ebw-stack.labels" . | nindent 4 }}
    {{- include "ebw-stack.selectorLabels" . | nindent 4 }}
data:
  clients.json: |
    {{- concat (list $demo $business) .Values.connector.clients | toPrettyJson | nindent 4 }}
