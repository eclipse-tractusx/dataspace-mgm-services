apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ebw-stack.fullname" . }}
  labels:
    {{- include "ebw-stack.labels" . | nindent 4 }}
    {{- include "ebw-stack.selectorLabels" . | nindent 4 }}
spec:
  # One instance: running transactions are in memory, and keys and data are files on one volume
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ebw-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ebw-stack.labels" . | nindent 8 }}
        {{- include "ebw-stack.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # The test tools come first: they write the public key of the trust list that the EBW-Connector reads
        - name: test-tools
          image: {{ include "ebw-stack.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: test-tools
              containerPort: 8079
              protocol: TCP
          env:
            - name: EBW_SERVICE
              value: test_tools
            - name: PUBLIC_URL
              value: {{ include "ebw-stack.testToolsUrl" . | quote }}
            {{- include "ebw-stack.commonEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.testTools.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- include "ebw-stack.probes" (dict "path" "/trust-list/signer-jwks" "port" "test-tools") | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "ebw-stack.commonMounts" . | nindent 12 }}
        - name: connector
          image: {{ include "ebw-stack.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: connector
              containerPort: 8077
              protocol: TCP
          env:
            - name: EBW_SERVICE
              value: connector
            - name: PUBLIC_URL
              value: {{ include "ebw-stack.connectorUrl" . | quote }}
            # the containers of a pod share localhost: the trust list comes straight from the test tools
            - name: TRUST_LIST_URL
              value: http://localhost:8079/trust-list
            - name: CLIENTS_FILE
              value: /config/clients.json
            {{- include "ebw-stack.commonEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.connector.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- include "ebw-stack.probes" (dict "path" "/.well-known/openid-configuration" "port" "connector") | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "ebw-stack.commonMounts" . | nindent 12 }}
            - name: clients
              mountPath: /config
              readOnly: true
        - name: business-wallet
          image: {{ include "ebw-stack.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: business-wallet
              containerPort: 8078
              protocol: TCP
          env:
            - name: EBW_SERVICE
              value: business_wallet
            - name: PUBLIC_URL
              value: {{ include "ebw-stack.businessWalletUrl" . | quote }}
            {{- include "ebw-stack.commonEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.businessWallet.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- include "ebw-stack.probes" (dict "path" "/jwks" "port" "business-wallet") | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "ebw-stack.commonMounts" . | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ebw-stack.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: clients
          configMap:
            name: {{ include "ebw-stack.fullname" . }}-clients
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
