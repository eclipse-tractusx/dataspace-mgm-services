{{- if .Values.ingress.enabled }}
{{- $fullName := include "ebw-stack.fullname" . }}
{{- $hosts := list (dict "host" .Values.connector.host "port" "connector") (dict "host" .Values.businessWallet.host "port" "business-wallet") (dict "host" .Values.testTools.host "port" "test-tools") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ebw-stack.labels" . | nindent 4 }}
    {{- include "ebw-stack.selectorLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: {{ .port }}
    {{- end }}
{{- end }}
