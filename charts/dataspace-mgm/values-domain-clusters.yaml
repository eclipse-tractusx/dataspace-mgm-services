# Values profile for ADR-0005 Domain Clusters deployment.
# Deploys 5 decoupled domain cluster runtimes instead of a single monolith pod:
#   1. onboarding: registration, company_profile, application_review
#   2. security: technical_user, credentials, app_access, dataspace_wallet_interface
#   3. marketplace: offers, subscriptions
#   4. connectivity: csp_connection, connector
#   5. operations: notifications, process_orchestration
#
# Usage:
#   helm install dataspace-mgm charts/dataspace-mgm -f charts/dataspace-mgm/values-domain-clusters.yaml

backend:
  # Monolithic backend is replaced by domain cluster runtimes below
  enabled: false

runtimes:
  enabled: true
  replicaCount: 1
  service:
    port: 8000
  items:
    - name: onboarding
      runtime: onboarding
      features:
        - registration
        - company_profile
        - application_review
      resources:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: security
      runtime: security
      features:
        - technical_user
        - credentials
        - app_access
        - dataspace_wallet_interface
      resources:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: marketplace
      runtime: marketplace
      features:
        - offers
        - subscriptions
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: connectivity
      runtime: connectivity
      features:
        - csp_connection
        - connector
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: operations
      runtime: operations
      features:
        - notifications
        - process_orchestration
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

# Database persistence configuration (ADR-0003, ADR-0005, TRG 3.02, TRG 5.06)
# To connect domain clusters to PostgreSQL instances provisioned via deploy/postgres/:
# database:
#   enabled: true
#   host: postgresql.dataspace-mgm.svc.cluster.local
#   port: 5432
#   database: dataspace_mgm
#   user: dataspace
#   existingSecret: dataspace-postgres-credentials
#   featureUrls:
#     registration: postgresql://dataspace_registration:secret@postgresql.dataspace-mgm.svc.cluster.local:5432/dataspace_registration
#     company_profile: postgresql://dataspace_company_profile:secret@postgresql.dataspace-mgm.svc.cluster.local:5432/dataspace_company_profile
