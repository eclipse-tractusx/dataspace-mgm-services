# Dedicated PostgreSQL service for multi-database feature persistence (ADR-0003, ADR-0005).
# Provisions separate database and role for each feature via init-feature-databases.sh.
# Usage:
#   docker compose -f docker-compose.yml -f deploy/postgres/docker-compose.postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-feature-databases.sh:/docker-entrypoint-initdb.d/init-feature-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
