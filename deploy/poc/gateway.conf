# Path routing of the PoC gateway: /api/<feature> goes to the runtime that serves that feature (ADR-0002, ADR-0003).
# Docker resolves the service names at start; the Helm chart renders one ingress path per feature.
server {
    listen 8080;

    resolver 127.0.0.11 valid=5s;   # Docker DNS: a restarted pod gets a new address
    set $registration http://registration:8000;
    set $company_profile http://company-profile:8000;

    location /api/registration/ { proxy_pass $registration; }       # a feature is served under its readable name
    location /api/company-profile/ { proxy_pass $company_profile; }

    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
}
