# Path routing of the OSP 2.0 gateway: /api/<feature> goes to the runtime that serves that feature (ADR-0002, ADR-0003, ADR-0005).
# Docker resolves the service names at start; the Helm chart renders one ingress path per feature.
server {
    listen 8080;

    resolver 127.0.0.11 valid=5s;   # Docker DNS: a restarted pod gets a new address

    # Domain Cluster Runtimes (ADR-0005)
    set $onboarding http://onboarding:8000;
    set $security http://security:8000;
    set $marketplace http://marketplace:8000;
    set $connectivity http://connectivity:8000;
    set $operations http://operations:8000;

    # Onboarding Domain (C1-M2, C1-M3, C3-M1)
    location /api/registration/ { proxy_pass $onboarding; }
    location /api/application-review/ { proxy_pass $onboarding; }
    location /api/company-profile/ { proxy_pass $onboarding; }

    # Access & Security Domain (C2-M2, C2-M3, C4-M1, C4-M2)
    location /api/app-access/ { proxy_pass $security; }
    location /api/technical-user/ { proxy_pass $security; }
    location /api/credentials/ { proxy_pass $security; }
    location /api/dataspace-wallet-interface/ { proxy_pass $security; }

    # Commercial & Marketplace Domain (C8-M1, C10-M1)
    location /api/offers/ { proxy_pass $marketplace; }
    location /api/subscriptions/ { proxy_pass $marketplace; }

    # Connectivity Domain (C3-M2, C6-M1)
    location /api/csp-connection/ { proxy_pass $connectivity; }
    location /api/connector/ { proxy_pass $connectivity; }

    # Operations & Orchestration Domain (C11-M1, C12-M1)
    location /api/notifications/ { proxy_pass $operations; }
    location /api/process-orchestration/ { proxy_pass $operations; }

    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
}
