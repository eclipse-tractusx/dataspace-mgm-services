# Path routing of the PoC gateway: /api/<module> goes to the runtime that serves that feature (ADR-0002).
# Docker resolves the service names at start; the Helm chart renders one ingress path per module.
server {
    listen 8080;

    resolver 127.0.0.11 valid=5s;   # Docker DNS: a restarted pod gets a new address
    set $registration http://registration:8000;
    set $company_profile http://company-profile:8000;

    location /api/c1-m2/ { proxy_pass $registration; }      # the paths keep the spec id (contract)
    location /api/c3-m1/ { proxy_pass $company_profile; }

    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
}
