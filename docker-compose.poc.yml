# PoC of the runtime split (ADR-0002, ADR-0003): the features registration (C1-M2) and company profile
# (C3-M1) as two pods of the same image, behind one gateway, with the Keycloak of docker-compose.yml.
# `RUNTIME` picks the runtime; the hybrid `RUNTIME: onboarding` would serve both in one pod.
#
#   docker compose -f docker-compose.yml -f docker-compose.poc.yml up -d --build
#   uv run python deploy/poc/poc_check.py
#
# Synchronous calls go over HTTP with the service token (MODULE_URLS), events over the event inbox of the
# peer (EVENT_SINKS). Modules that do not run here answer with their built-in stand-in (empty address).
x-runtime: &runtime
  image: tractusx/dataspace-mgm-service:poc
  read_only: true
  tmpfs: [/tmp]
  depends_on: [iam]
  environment: &runtime-env
    TEST_TOOLS: "false"
    IAM_URL: http://iam:8080/auth
    IAM_REALM: CX-Central
    IAM_ISSUER: http://localhost:8080/auth/realms/CX-Central
    SETTINGS_FILE: /app/config/osp-a/installation.json
    MODULE_URLS_DEFAULT: ""
    MODULE_URLS: '{"registration": "http://registration:8000", "company_profile": "http://company-profile:8000"}'

services:
  registration:
    <<: *runtime
    build: .   # built once, the other runtimes use the same image
    environment:
      <<: *runtime-env
      RUNTIME: registration          # features/registration/main.py
      BASE_URL: http://registration:8000
      EVENT_SINKS: http://company-profile:8000

  company-profile:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      RUNTIME: company_profile       # features/company_profile/main.py
      BASE_URL: http://company-profile:8000
      EVENT_SINKS: http://registration:8000

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["8000:8080"]
    volumes: ["./deploy/poc/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [registration, company-profile]
