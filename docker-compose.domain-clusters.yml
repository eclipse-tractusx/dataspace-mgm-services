# Full Production-Grade Domain Clusters & Multi-Database Deployment (ADR-0002, ADR-0003, ADR-0005).
# Deploys 5 isolated domain clusters + PostgreSQL with per-feature database isolation + NGINX gateway.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.domain-clusters.yml up -d --build
#

x-runtime: &runtime
  image: tractusx/dataspace-mgm-service:domain-cluster
  read_only: true
  tmpfs: [/tmp]
  depends_on:
    iam:
      condition: service_started
    postgres:
      condition: service_healthy
  environment: &runtime-env
    TEST_TOOLS: "false"
    IAM_URL: http://iam:8080/auth
    IAM_REALM: CX-Central
    IAM_ISSUER: http://localhost:8080/auth/realms/CX-Central
    SETTINGS_FILE: /app/config/osp-a/installation.json
    MODULE_URLS_DEFAULT: ""
    MODULE_URLS: >-
      {
        "registration": "http://onboarding:8000",
        "application_review": "http://onboarding:8000",
        "company_profile": "http://onboarding:8000",
        "app_access": "http://security:8000",
        "technical_user": "http://security:8000",
        "credentials": "http://security:8000",
        "dataspace_wallet_interface": "http://security:8000",
        "offers": "http://marketplace:8000",
        "subscriptions": "http://marketplace:8000",
        "csp_connection": "http://connectivity:8000",
        "connector": "http://connectivity:8000",
        "notifications": "http://operations:8000",
        "process_orchestration": "http://operations:8000"
      }
    # Events: every runtime forwards to Process Orchestration (`process_orchestration` above), the event hub, which
    # routes them on to the runtimes with subscribers (ADR-0006); no EVENT_SINKS mesh needed.
    REGISTRATION_DATABASE_URL: postgresql://registration:registration_test_pass@postgres:5432/registration
    APPLICATION_REVIEW_DATABASE_URL: postgresql://application_review:application_review_test_pass@postgres:5432/application_review
    COMPANY_PROFILE_DATABASE_URL: postgresql://company_profile:company_profile_test_pass@postgres:5432/company_profile
    APP_ACCESS_DATABASE_URL: postgresql://app_access:app_access_test_pass@postgres:5432/app_access
    TECHNICAL_USER_DATABASE_URL: postgresql://technical_user:technical_user_test_pass@postgres:5432/technical_user
    CREDENTIALS_DATABASE_URL: postgresql://credentials:credentials_test_pass@postgres:5432/credentials
    DATASPACE_WALLET_INTERFACE_DATABASE_URL: postgresql://dataspace_wallet_interface:dataspace_wallet_interface_test_pass@postgres:5432/dataspace_wallet_interface
    OFFERS_DATABASE_URL: postgresql://offers:offers_test_pass@postgres:5432/offers
    SUBSCRIPTIONS_DATABASE_URL: postgresql://subscriptions:subscriptions_test_pass@postgres:5432/subscriptions
    CSP_CONNECTION_DATABASE_URL: postgresql://csp_connection:csp_connection_test_pass@postgres:5432/csp_connection
    CONNECTOR_DATABASE_URL: postgresql://connector:connector_test_pass@postgres:5432/connector
    NOTIFICATIONS_DATABASE_URL: postgresql://notifications:notifications_test_pass@postgres:5432/notifications
    PROCESS_ORCHESTRATION_DATABASE_URL: postgresql://process_orchestration:process_orchestration_test_pass@postgres:5432/process_orchestration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-cluster-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-feature-databases.sh:/docker-entrypoint-initdb.d/init-feature-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  onboarding:
    <<: *runtime
    build: .
    environment:
      <<: *runtime-env
      RUNTIME: onboarding
      BASE_URL: http://onboarding:8000

  security:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      RUNTIME: security
      BASE_URL: http://security:8000

  marketplace:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      RUNTIME: marketplace
      BASE_URL: http://marketplace:8000

  connectivity:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      RUNTIME: connectivity
      BASE_URL: http://connectivity:8000

  operations:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      RUNTIME: operations
      BASE_URL: http://operations:8000

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["8000:8080"]
    volumes: ["./deploy/poc/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      - onboarding
      - security
      - marketplace
      - connectivity
      - operations

volumes:
  postgres-cluster-data:
