# Adapted from eclipse-tractusx/tractusx-testlab's `dependencies.yml` (TRG 7.01, TRG 7.04).
# The runtime dependencies are resolved from uv.lock, checked against the Eclipse Dash
# License Tool and compared with the committed DEPENDENCIES file, so a change to the lock
# file that is not reflected in DEPENDENCIES fails CI.
#
# Requesting IP reviews and keeping DEPENDENCIES current is the job of
# `dependencies-update.yml`; this workflow only checks.

name: "Eclipse Dash IP Check"

on:
  push:
    branches: [main]
    paths:
      - uv.lock
      - pyproject.toml
      - DEPENDENCIES
      - .github/workflows/dependencies.yml
  pull_request:
    branches: [main]
    paths:
      - uv.lock
      - pyproject.toml
      - DEPENDENCIES
      - .github/workflows/dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DEP_FILE: DEPENDENCIES
  DASH_VERSION: "1.1.0"

jobs:
  check-dependencies:
    name: Dash license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Runtime dependencies only (no dev group, not the project itself), exactly as
      # locked, so the resolver step is reproducible and never builds a package.
      - name: List packages
        run: |
          if [ ! -f uv.lock ]; then
            echo "The project must have a uv.lock file"
            exit 1
          fi
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt \
            | grep -E '^[A-Za-z0-9_.-]+==' \
            | sed -E 's/[[:space:]]*;.*$//' \
            | awk -F'==' '{ name=tolower($1); gsub(/[_.]/, "-", name); print "pypi/pypi/-/" name "/" $2 }' \
            | sort -u > PACKAGE
          echo "Packages resolved from uv.lock on this runner:"
          cat PACKAGE

      - name: Generate dependencies file
        run: |
          curl --proto '=https' --tlsv1.2 -sSL --fail --output ./dash.jar "https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=${DASH_VERSION}&maven.extension=jar"
          # Dash exits non-zero when any entry is restricted, which the next
          # steps report far more readably, so its exit status is ignored here.
          # An empty summary means the license lookup itself failed (the
          # ClearlyDefined query has been seen to time out silently), and that
          # must not be mistaken for "the file drifted".
          java -jar ./dash.jar PACKAGE -project automotive.tractusx -timeout 300 -summary "$DEP_FILE" || true
          if [ ! -s "$DEP_FILE" ]; then
            echo "Dash wrote no summary; the license lookup failed. Re-run the job."
            exit 1
          fi
          sort -o "$DEP_FILE" "$DEP_FILE"

      - name: Check if dependencies were changed
        run: |
          if git diff --exit-code "$DEP_FILE"; then
            echo "$DEP_FILE is up to date"
          else
            echo "$DEP_FILE is out of date. Replace it with the following content:"
            cat "$DEP_FILE"
            exit 1
          fi

      - name: Check for restricted or rejected dependencies
        run: |
          restricted=$(grep -E ', (restricted|rejected),' "$DEP_FILE" || true)
          if [[ -n "$restricted" ]]; then
            echo "The following dependencies are restricted or rejected and need an IP review:"
            echo "$restricted"
            exit 1
          fi

      - name: Upload dependencies file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DEPENDENCIES
          path: ${{ env.DEP_FILE }}
          if-no-files-found: ignore
