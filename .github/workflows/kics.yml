# Infrastructure as code scanning with KICS (TRG 8.02): Dockerfile, Helm chart, GitHub workflows
name: "KICS"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # once a week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run KICS scan with SARIF result
        uses: checkmarx/kics-github-action@4a16c2130b02104dc2624c133d5224080e7cc49b # v2.2.1
        with:
          path: "."
          output_path: kicsResults/
          output_formats: "json,sarif"
          # fail on high (and above) findings and on KICS engine errors
          fail_on: high
          # secrets are covered by TruffleHog
          disable_secrets: true

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: kicsResults/results.sarif
