# Adapted from eclipse-tractusx/tractusx-testlab's `dependencies-update.yml` (TRG 7.04).
# Keeps DEPENDENCIES in step with uv.lock on main. Each run regenerates the
# file with Dash, asks the Eclipse IP team to review whatever is restricted
# (with the GitLab token in the DASH_GITLAB_API_TOKEN repository secret), and
# opens or updates one pull request on `chore/update-dependencies` when the
# file differs from main. It runs after every change to the lock file and once
# a day, so an approved review turns into a pull request without anyone
# watching the IP Lab issue. When the file matches main again, the branch is
# deleted and the pull request closes.

name: "Update DEPENDENCIES"

on:
  push:
    branches: [main]
    paths:
      - uv.lock
      - pyproject.toml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: dependencies-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEP_FILE: DEPENDENCIES
  DASH_VERSION: "1.1.0"

jobs:
  update-dependencies:
    name: Regenerate DEPENDENCIES
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The package list is resolved exactly as in `dependencies.yml`, so the
      # file this job proposes is the one the check expects.
      - name: List packages
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt \
            | grep -E '^[A-Za-z0-9_.-]+==' \
            | sed -E 's/[[:space:]]*;.*$//' \
            | awk -F'==' '{ name=tolower($1); gsub(/[_.]/, "-", name); print "pypi/pypi/-/" name "/" $2 }' \
            | sort -u > PACKAGE

      - name: Generate dependencies file
        run: |
          curl --proto '=https' --tlsv1.2 -sSL --fail --output ./dash.jar "https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=${DASH_VERSION}&maven.extension=jar"
          java -jar ./dash.jar PACKAGE -project automotive.tractusx -timeout 300 -summary "$DEP_FILE" || true
          if [ ! -s "$DEP_FILE" ]; then
            echo "Dash wrote no summary; the license lookup failed. Re-run the job."
            exit 1
          fi
          sort -o "$DEP_FILE" "$DEP_FILE"

      # Dash finds the review requests it already opened and logs their links
      # again, so a daily run never files duplicates and the pull request body
      # always lists every open request. Dash submits only a few per run; the
      # next run submits the rest.
      - name: Request IP review for restricted dependencies
        env:
          GITLAB_API_TOKEN: ${{ secrets.DASH_GITLAB_API_TOKEN }}
        run: |
          : > reviews.txt
          if ! grep -q 'restricted' "$DEP_FILE"; then
            echo "No restricted dependencies, nothing to review."
            exit 0
          fi
          if [ -z "$GITLAB_API_TOKEN" ]; then
            echo "::warning::Restricted dependencies found but the DASH_GITLAB_API_TOKEN secret is not set; no IP review was requested."
            echo "missing-token" > reviews.txt
            exit 0
          fi
          java -jar ./dash.jar PACKAGE -project automotive.tractusx -timeout 300 \
            -repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -review -token "$GITLAB_API_TOKEN" 2>&1 | tee review.log || true
          grep -oE 'https://gitlab\.eclipse\.org/[^ ]+/issues/[0-9]+' review.log | sort -u > reviews.txt || true

      - name: Write pull request body
        run: |
          {
            echo "Dash regenerated \`$DEP_FILE\` from \`uv.lock\` on main."
            echo
            restricted=$(grep 'restricted' "$DEP_FILE" || true)
            if [ -n "$restricted" ]; then
              echo "### Waiting for IP review"
              echo
              echo '```'
              echo "$restricted"
              echo '```'
              echo
              if grep -q 'missing-token' reviews.txt; then
                echo "No review was requested: the \`DASH_GITLAB_API_TOKEN\` secret is not set."
              elif [ -s reviews.txt ]; then
                echo "Review requests:"
                sed 's/^/- /' reviews.txt
              else
                echo "Dash reported no review request; see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              fi
              echo
              echo "This pull request is updated every day. Merge it once nothing is waiting for review."
            else
              echo "Every dependency is approved."
            fi
            echo
            echo "Pull requests opened by this workflow do not start other workflows. Close and reopen it to run the checks."
          } > pr-body.md

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ env.DEP_FILE }}
          branch: chore/update-dependencies
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "chore(deps): update DEPENDENCIES"
          title: "chore(deps): update DEPENDENCIES"
          body-path: pr-body.md
